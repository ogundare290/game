<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizMatch - Real-time Multiplayer Quiz</title>
  <style>
    :root {
      --primary: #378ADD;
      --secondary: #1D9E75;
      --accent: #D85A30;
      --danger: #E24B4A;
      --bg-dark: #0F1419;
      --bg-card: #1A1F26;
      --text-primary: #E8EAED;
      --text-secondary: #A8ACAF;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-dark);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    .container { max-width: 900px; margin: 0 auto; padding: 20px; }

    .screen { display: none; animation: fadeIn 0.3s ease-in-out; }
    .screen.active { display: block; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .card {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h2 { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
    .subtext { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; }

    input, select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 16px;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(55, 138, 221, 0.1);
    }

    .btn {
      padding: 12px 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: var(--primary);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      margin-top: 8px;
      font-size: 16px;
    }

    .btn:hover { background: #2970b8; transform: translateY(-2px); }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); color: var(--text-primary); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }
    .btn-success { background: var(--secondary); }
    .btn-success:hover { background: #158564; }

    .waiting {
      text-align: center;
      padding: 40px 20px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .player-vs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .player-card {
      background: rgba(255, 255, 255, 0.05);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .player-name { font-weight: 600; margin-bottom: 8px; }
    .player-score { font-size: 32px; font-weight: 700; color: var(--primary); }

    .question-container {
      background: rgba(55, 138, 221, 0.1);
      border-left: 4px solid var(--primary);
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
    }

    .question-text { font-size: 18px; font-weight: 500; margin-bottom: 20px; }

    .options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .timer {
      font-size: 48px;
      font-weight: 700;
      text-align: center;
      margin: 20px 0;
      color: var(--primary);
    }

    .timer.warning { color: #FAA61A; }
    .timer.critical { color: var(--danger); }

    .progress-bar {
      background: rgba(255, 255, 255, 0.1);
      height: 6px;
      border-radius: 3px;
      margin: 12px 0;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      transition: width 0.3s ease;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .alert-error {
      background: rgba(226, 75, 74, 0.2);
      border: 1px solid rgba(226, 75, 74, 0.5);
      color: #FF6B6B;
    }

    .alert-success {
      background: rgba(29, 158, 117, 0.2);
      border: 1px solid rgba(29, 158, 117, 0.5);
      color: #51CF66;
    }

    @media (max-width: 768px) {
      .player-vs { grid-template-columns: 1fr; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- WELCOME SCREEN -->
  <div class="screen active" id="welcome">
    <div style="text-align: center; padding: 40px 0;">
      <h1>⚡ QuizMatch</h1>
      <p class="subtext" style="margin: 20px 0; font-size: 16px;">Real-time multiplayer quiz battles with real students!</p>
    </div>
    
    <div class="card">
      <h2>Join a Game</h2>
      
      <div id="connectionStatus" style="display: none;"></div>
      
      <div>
        <label style="display: block; margin-bottom: 8px; font-weight: 500;">Your Name</label>
        <input type="text" id="playerName" placeholder="Enter your name" />
      </div>
      
      <div>
        <label style="display: block; margin-bottom: 8px; font-weight: 500;">Select Subject</label>
        <select id="subject">
          <option value="">-- Choose a subject --</option>
          <option value="math">Mathematics</option>
          <option value="science">Science</option>
          <option value="history">History</option>
          <option value="english">English</option>
          <option value="biology">Biology</option>
        </select>
      </div>
      
      <button class="btn btn-success" onclick="joinGame()">Find Opponent</button>
    </div>
  </div>
  
  <!-- WAITING SCREEN -->
  <div class="screen" id="waiting">
    <div class="waiting">
      <div class="spinner"></div>
      <h2>Searching for Opponent...</h2>
      <p class="subtext" style="margin: 20px 0;">Looking for another student in <strong id="waitingSubject"></strong></p>
      <p class="subtext" style="font-size: 13px; color: #888;">You: <strong id="waitingName"></strong></p>
      <button class="btn btn-secondary" onclick="cancelWait()" style="margin-top: 24px;">Cancel</button>
    </div>
  </div>
  
  <!-- GAME SCREEN -->
  <div class="screen" id="gameScreen">
    <div style="margin-bottom: 20px;">
      <div class="player-vs">
        <div class="player-card">
          <div class="player-name" id="p1Name">Player 1</div>
          <div class="player-score" id="p1Score">0</div>
        </div>
        <div class="player-card">
          <div class="player-name" id="p2Name">Player 2</div>
          <div class="player-score" id="p2Score">0</div>
        </div>
      </div>
      
      <div style="text-align: center; color: var(--text-secondary); margin-bottom: 16px;">
        Question <span id="questionNum">1</span>/20
      </div>
      
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 5%;"></div>
      </div>
    </div>
    
    <div class="question-container">
      <div class="timer" id="timer">45</div>
      <div class="question-text" id="question">Question loading...</div>
      <div class="options" id="optionsContainer"></div>
    </div>
    
    <button class="btn btn-secondary" onclick="leaveGame()" style="margin-top: 24px;">Leave Game</button>
  </div>
  
  <!-- RESULTS SCREEN -->
  <div class="screen" id="results">
    <div class="card">
      <h2 style="text-align: center; margin-bottom: 24px;">🎉 Game Over!</h2>
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
        <div style="background: rgba(255, 215, 0, 0.1); border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 8px; padding: 16px; text-align: center;">
          <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase;">🥇 Winner</div>
          <div style="font-weight: 600; margin-bottom: 8px;" id="winnerName">--</div>
          <div style="font-size: 28px; font-weight: 700;" id="winnerScore">0</div>
        </div>
        <div style="background: rgba(192, 192, 192, 0.1); border: 1px solid rgba(192, 192, 192, 0.3); border-radius: 8px; padding: 16px; text-align: center;">
          <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase;">🥈 Runner Up</div>
          <div style="font-weight: 600; margin-bottom: 8px;" id="loserName">--</div>
          <div style="font-size: 28px; font-weight: 700;" id="loserScore">0</div>
        </div>
      </div>
      
      <button class="btn btn-success" onclick="requestRematch()">🔄 Rematch with Same Opponent</button>
      <button class="btn btn-secondary" onclick="goHome()">🏠 Back to Home</button>
    </div>
  </div>

</div>

<script>
// ============= CONNECTION SETUP =============
let ws = null;
let playerId = null;
let gameId = null;
let playerNumber = null;
let currentQuestionIndex = 0;
let gameQuestions = [];
let timerInterval = null;
let answered = false;

const WS_URL = `${window.location.protocol === 'https:' ? 'wss' : 'ws'}://${window.location.host}`;

function connectToServer() {
  return new Promise((resolve) => {
    try {
      ws = new WebSocket(WS_URL);
      
      ws.onopen = () => {
        console.log('Connected to server');
        updateConnectionStatus('Connected ✓', 'success');
        resolve(true);
      };
      
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        handleServerMessage(data);
      };
      
      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
        updateConnectionStatus('Connection error', 'error');
      };
      
      ws.onclose = () => {
        console.log('Disconnected from server');
        updateConnectionStatus('Disconnected', 'error');
      };
    } catch (err) {
      console.error('Connection failed:', err);
      updateConnectionStatus('Failed to connect', 'error');
      resolve(false);
    }
  });
}

function updateConnectionStatus(message, type) {
  const statusEl = document.getElementById('connectionStatus');
  if (statusEl) {
    statusEl.innerHTML = `<div class="alert alert-${type === 'success' ? 'success' : 'error'}">${message}</div>`;
    if (type === 'success') {
      setTimeout(() => {
        statusEl.style.display = 'none';
      }, 3000);
    }
  }
}

// ============= GAME FLOW =============
async function joinGame() {
  const playerName = document.getElementById('playerName').value.trim();
  const subject = document.getElementById('subject').value;
  
  if (!playerName) {
    alert('Please enter your name');
    return;
  }
  if (!subject) {
    alert('Please select a subject');
    return;
  }
  
  // Connect to server if not already connected
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    const connected = await connectToServer();
    if (!connected) {
      alert('Failed to connect to server. Please try again.');
      return;
    }
  }
  
  // Send join message
  ws.send(JSON.stringify({
    type: 'PLAYER_JOIN',
    playerName,
    subject,
  }));
  
  // Show waiting screen
  document.getElementById('waitingSubject').textContent = subject.charAt(0).toUpperCase() + subject.slice(1);
  document.getElementById('waitingName').textContent = playerName;
  switchScreen('waiting');
}

function cancelWait() {
  if (ws) ws.close();
  switchScreen('welcome');
}

function handleServerMessage(data) {
  console.log('Server message:', data.type);
  
  switch (data.type) {
    case 'PLAYER_REGISTERED':
      playerId = data.playerId;
      console.log('Registered with ID:', playerId);
      break;
      
    case 'MATCH_FOUND':
      handleMatchFound(data);
      break;
      
    case 'ANSWER_RESULT':
      handleAnswerResult(data);
      break;
      
    case 'GAME_OVER':
      handleGameOver(data);
      break;
      
    case 'REMATCH_STARTED':
      handleRematchStarted(data);
      break;
      
    case 'OPPONENT_DISCONNECTED':
      alert('Opponent disconnected. Game ended.');
      switchScreen('welcome');
      break;
  }
}

function handleMatchFound(data) {
  gameId = data.gameId;
  playerNumber = data.playerNumber;
  gameQuestions = data.questions;
  currentQuestionIndex = 0;
  
  const opponentName = data.opponent.playerName;
  const myName = document.getElementById('playerName').value;
  
  if (playerNumber === 1) {
    document.getElementById('p1Name').textContent = myName;
    document.getElementById('p2Name').textContent = opponentName;
  } else {
    document.getElementById('p1Name').textContent = opponentName;
    document.getElementById('p2Name').textContent = myName;
  }
  
  switchScreen('gameScreen');
  loadQuestion();
}

function loadQuestion() {
  if (currentQuestionIndex >= gameQuestions.length) {
    return; // Game should have ended already
  }
  
  answered = false;
  const q = gameQuestions[currentQuestionIndex];
  
  document.getElementById('questionNum').textContent = currentQuestionIndex + 1;
  document.getElementById('progressFill').style.width = ((currentQuestionIndex / 20) * 100) + '%';
  document.getElementById('question').textContent = q.q;
  
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'btn btn-secondary';
    btn.textContent = opt;
    btn.onclick = () => submitAnswer(i);
    container.appendChild(btn);
  });
  
  startTimer();
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  
  let time = 45;
  const timerEl = document.getElementById('timer');
  
  timerInterval = setInterval(() => {
    timerEl.textContent = time;
    timerEl.className = 'timer';
    
    if (time <= 5) timerEl.classList.add('critical');
    else if (time <= 15) timerEl.classList.add('warning');
    
    time--;
    if (time < 0) {
      clearInterval(timerInterval);
      if (!answered) {
        submitAnswer(-1); // Timeout, no answer selected
      }
    }
  }, 1000);
}

function submitAnswer(selectedOption) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);
  
  // Send answer to server
  ws.send(JSON.stringify({
    type: 'SUBMIT_ANSWER',
    playerId,
    gameId,
    questionIndex: currentQuestionIndex,
    selectedOption,
  }));
}

function handleAnswerResult(data) {
  console.log('Answer result:', data);
  
  // Update scores
  document.getElementById('p1Score').textContent = data.p1Score;
  document.getElementById('p2Score').textContent = data.p2Score;
  
  currentQuestionIndex++;
  
  // Move to next question after delay
  if (currentQuestionIndex < gameQuestions.length) {
    setTimeout(loadQuestion, 2000);
  }
}

function handleGameOver(data) {
  clearInterval(timerInterval);
  
  const isP1 = playerNumber === 1;
  const p1IsWinner = data.p1.playerId === data.winner;
  
  if (isP1 ? p1IsWinner : !p1IsWinner) {
    document.getElementById('winnerName').textContent = document.getElementById('p1Name').textContent;
    document.getElementById('winnerScore').textContent = data.p1.score;
    document.getElementById('loserName').textContent = document.getElementById('p2Name').textContent;
    document.getElementById('loserScore').textContent = data.p2.score;
  } else {
    document.getElementById('winnerName').textContent = document.getElementById('p2Name').textContent;
    document.getElementById('winnerScore').textContent = data.p2.score;
    document.getElementById('loserName').textContent = document.getElementById('p1Name').textContent;
    document.getElementById('loserScore').textContent = data.p1.score;
  }
  
  switchScreen('results');
}

function requestRematch() {
  ws.send(JSON.stringify({
    type: 'REMATCH_REQUEST',
    playerId,
    gameId,
  }));
}

function handleRematchStarted(data) {
  gameQuestions = data.questions;
  currentQuestionIndex = 0;
  document.getElementById('p1Score').textContent = '0';
  document.getElementById('p2Score').textContent = '0';
  switchScreen('gameScreen');
  loadQuestion();
}

function leaveGame() {
  if (ws) ws.close();
  switchScreen('welcome');
}

function goHome() {
  leaveGame();
}

function switchScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

// Initialize connection on page load
window.addEventListener('DOMContentLoaded', () => {
  connectToServer();
});
</script>

</body>
</html>
