<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Quiz Matchmaking Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            text-align: center;
            animation: slideIn 0.6s ease-out;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        .emoji {
            font-size: 3em;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .button {
            display: inline-block;
            padding: 16px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.6);
        }
        .button:active {
            transform: translateY(-1px);
        }
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 40px;
            text-align: left;
        }
        .feature {
            padding: 20px;
            background: #f8f9ff;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .feature-icon {
            font-size: 1.8em;
            margin-right: 10px;
        }
        .feature-title {
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .feature-desc {
            color: #666;
            font-size: 0.9em;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🎓</div>
        <h1>Quiz Matchmaking Game</h1>
        <p>Challenge another student in real-time head-to-head quizzes!</p>
        
        <div class="features">
            <div class="feature">
                <div class="feature-title"><span class="feature-icon">⚡</span>Real-time Multiplayer</div>
                <div class="feature-desc">Compete live against opponents</div>
            </div>
            <div class="feature">
                <div class="feature-title"><span class="feature-icon">⏱️</span>Timed Questions</div>
                <div class="feature-desc">45 seconds per challenge</div>
            </div>
            <div class="feature">
                <div class="feature-title"><span class="feature-icon">🎯</span>Smart Scoring</div>
                <div class="feature-desc">Points + time bonuses</div>
            </div>
            <div class="feature">
                <div class="feature-title"><span class="feature-icon">📊</span>Track Progress</div>
                <div class="feature-desc">View detailed results</div>
            </div>
        </div>

        <button class="button" onclick="startGame()">
            <span class="loading"></span>Start Playing Now
        </button>
    </div>

    <script>
        function startGame() {
            // Load the game
            window.location.href = 'student_matchmaking_game.html';
        }
    </script>
</body>
</html>
