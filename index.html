<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizMatch - Student Quiz Game</title>
  <style>
    :root {
      --primary: #378ADD;
      --secondary: #1D9E75;
      --accent: #D85A30;
      --danger: #E24B4A;
      --bg-dark: #0F1419;
      --bg-card: #1A1F26;
      --text-primary: #E8EAED;
      --text-secondary: #A8ACAF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .screen {
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .subtext {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 20px;
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 16px;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(55, 138, 221, 0.1);
    }

    .btn {
      padding: 12px 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: var(--primary);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      margin-top: 8px;
      font-size: 16px;
    }

    .btn:hover {
      background: #2970b8;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-success {
      background: var(--secondary);
    }

    .btn-success:hover {
      background: #158564;
    }

    .btn-small {
      padding: 8px 16px;
      font-size: 13px;
      margin-top: 0;
    }

    .nav-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      overflow-x: auto;
    }

    .nav-btn {
      padding: 8px 16px;
      border: none;
      background: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-weight: 500;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .nav-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .nav-btn:hover {
      color: var(--text-primary);
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-secondary);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
    }

    .leaderboard-table th {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
    }

    .leaderboard-table td {
      padding: 16px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .leaderboard-table tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .rank {
      font-weight: 700;
      font-size: 18px;
      color: var(--primary);
      width: 40px;
    }

    .rank.gold { color: #FFD700; }
    .rank.silver { color: #C0C0C0; }
    .rank.bronze { color: #CD7F32; }

    .player-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 14px;
      color: white;
    }

    .player-info {
      flex: 1;
    }

    .player-name {
      font-weight: 600;
      margin-bottom: 2px;
    }

    .player-meta {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .stat-cell {
      text-align: center;
      font-weight: 600;
    }

    .stat-small {
      font-size: 13px;
      color: var(--text-secondary);
      display: block;
    }

    .my-rank {
      background: rgba(55, 138, 221, 0.1);
      border: 1px solid rgba(55, 138, 221, 0.3);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: center;
    }

    .rank-position {
      font-size: 48px;
      font-weight: 700;
      color: var(--primary);
      margin: 8px 0;
    }

    .question-container {
      background: rgba(55, 138, 221, 0.1);
      border-left: 4px solid var(--primary);
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
    }

    .question-text {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .timer {
      font-size: 48px;
      font-weight: 700;
      text-align: center;
      margin: 20px 0;
      color: var(--primary);
    }

    .timer.warning { color: #FAA61A; }
    .timer.critical { color: var(--danger); }

    .progress-bar {
      background: rgba(255, 255, 255, 0.1);
      height: 6px;
      border-radius: 3px;
      margin: 12px 0;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      transition: width 0.3s ease;
    }

    .waiting {
      text-align: center;
      padding: 40px 20px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .container { padding: 12px; }
      h1 { font-size: 24px; }
      h2 { font-size: 18px; }
      .card { padding: 16px; }
      .leaderboard-table { font-size: 14px; }
      .leaderboard-table th, .leaderboard-table td { padding: 8px; }
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- WELCOME SCREEN -->
  <div class="screen active" id="welcome">
    <div style="text-align: center; padding: 40px 0;">
      <h1>⚡ QuizMatch</h1>
      <p class="subtext" style="margin: 20px 0; font-size: 16px;">Compete with classmates in real-time. Answer faster, score points!</p>
    </div>
    
    <div class="card">
      <h2>Join a Game</h2>
      
      <div>
        <label style="display: block; margin-bottom: 8px; font-weight: 500;">Your Name</label>
        <input type="text" id="playerName" placeholder="Enter your name" />
      </div>
      
      <div>
        <label style="display: block; margin-bottom: 8px; font-weight: 500;">Select Subject</label>
        <select id="subject">
          <option value="">-- Choose a subject --</option>
          <option value="math">Mathematics</option>
          <option value="science">Science</option>
          <option value="history">History</option>
          <option value="english">English</option>
          <option value="biology">Biology</option>
        </select>
      </div>
      
      <button class="btn btn-success" onclick="switchToGame()">Play Game</button>
      <button class="btn btn-secondary" onclick="switchToLeaderboard()">View Leaderboards</button>
    </div>
  </div>
  
  <!-- LEADERBOARD SCREEN -->
  <div class="screen" id="leaderboardScreen">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <h1 style="margin: 0;">🏆 Leaderboards</h1>
      <button class="btn btn-secondary btn-small" onclick="switchToWelcome()" style="width: auto;">← Back</button>
    </div>
    
    <div class="card">
      <div class="nav-bar">
        <button class="nav-btn active" onclick="switchLeaderboardTab(event, 'overall')">Overall</button>
        <button class="nav-btn" onclick="switchLeaderboardTab(event, 'math')">Math</button>
        <button class="nav-btn" onclick="switchLeaderboardTab(event, 'science')">Science</button>
        <button class="nav-btn" onclick="switchLeaderboardTab(event, 'history')">History</button>
        <button class="nav-btn" onclick="switchLeaderboardTab(event, 'english')">English</button>
        <button class="nav-btn" onclick="switchLeaderboardTab(event, 'biology')">Biology</button>
      </div>
      
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-btn active" onclick="switchTimeframe(event, 'week')">This Week</button>
        <button class="filter-btn" onclick="switchTimeframe(event, 'month')">This Month</button>
        <button class="filter-btn" onclick="switchTimeframe(event, 'all-time')">All Time</button>
      </div>
      
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th style="width: 50px;">Rank</th>
            <th style="flex: 1;">Player</th>
            <th style="width: 80px;">Points</th>
            <th style="width: 80px;">Wins</th>
            <th style="width: 80px;">Win %</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody">
        </tbody>
      </table>
    </div>
  </div>
  
  <!-- GAME SCREEN -->
  <div class="screen" id="gameScreen">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <div style="flex: 1;">
        <h2 style="margin: 0; margin-bottom: 4px;" id="p1Name"></h2>
        <div style="font-size: 28px; font-weight: 700; color: var(--primary);" id="p1Score">0</div>
      </div>
      <div style="text-align: center;">
        <div style="font-size: 13px; color: var(--text-secondary);">Q<span id="questionNum">1</span>/20</div>
      </div>
      <div style="flex: 1; text-align: right;">
        <h2 style="margin: 0; margin-bottom: 4px;" id="p2Name"></h2>
        <div style="font-size: 28px; font-weight: 700; color: var(--secondary);" id="p2Score">0</div>
      </div>
    </div>
    
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 5%;"></div>
    </div>
    
    <div class="question-container">
      <div class="timer" id="timer">45</div>
      <div class="question-text" id="question"></div>
      <div class="options" id="optionsContainer"></div>
    </div>
    
    <button class="btn btn-secondary" onclick="switchToWelcome()" style="margin-top: 24px;">Cancel Game</button>
  </div>
  
  <!-- RESULTS SCREEN -->
  <div class="screen" id="results">
    <div class="card">
      <h2 style="text-align: center; margin-bottom: 24px;">🎉 Game Over!</h2>
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
        <div style="background: rgba(255, 215, 0, 0.1); border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 8px; padding: 16px; text-align: center;">
          <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase;">🥇 Winner</div>
          <div style="font-size: 32px; font-weight: 700; margin-bottom: 8px;" id="winnerScore">0</div>
          <div style="font-weight: 600;" id="winnerName">--</div>
        </div>
        <div style="background: rgba(192, 192, 192, 0.1); border: 1px solid rgba(192, 192, 192, 0.3); border-radius: 8px; padding: 16px; text-align: center;">
          <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase;">🥈 Runner Up</div>
          <div style="font-size: 32px; font-weight: 700; margin-bottom: 8px;" id="loserScore">0</div>
          <div style="font-weight: 600;" id="loserName">--</div>
        </div>
      </div>
      
      <button class="btn btn-success" onclick="rematchSamePlayer()">🔄 Rematch</button>
      <button class="btn btn-secondary" onclick="switchToWelcome()">🏠 Home</button>
    </div>
  </div>

</div>

// ============= GAME STATE =============
let gameState = {
  p1: { name: '', subject: '', score: 0 },
  p2: { name: 'Bot Opponent', subject: '', score: 0 },
  currentQ: 0,
  questions: [],
  answered: false,
  currentLeaderboard: 'overall',
  currentTimeframe: 'week',
};

let timerInterval = null;

// ============= GAME FUNCTIONS =============
function switchToGame() {
  const name = document.getElementById('playerName').value.trim();
  const subject = document.getElementById('subject').value;
  
  if (!name) {
    alert('Please enter your name');
    return;
  }
  if (!subject) {
    alert('Please select a subject');
    return;
  }
  
  gameState.p1 = { name, subject, score: 0 };
  document.getElementById('p1Name').textContent = name;
  document.getElementById('p2Name').textContent = 'Opponent';
  
  gameState.questions = (questionBank[subject] || []).slice(0, 20);
  if (gameState.questions.length < 20) {
    for (let i = gameState.questions.length; i < 20; i++) {
      gameState.questions.push(gameState.questions[i % gameState.questions.length]);
    }
  }
  
  gameState.currentQ = 0;
  switchScreen('gameScreen');
  loadQuestion();
}

function loadQuestion() {
  const q = gameState.questions[gameState.currentQ];
  document.getElementById('questionNum').textContent = gameState.currentQ + 1;
  document.getElementById('progressFill').style.width = ((gameState.currentQ / 20) * 100) + '%';
  document.getElementById('question').textContent = q.q;
  
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'btn btn-secondary';
    btn.textContent = opt;
    btn.onclick = () => answerQuestion(i, q.ans);
    container.appendChild(btn);
  });
  
  gameState.answered = false;
  startTimer();
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  
  let time = 45;
  const timerEl = document.getElementById('timer');
  
  timerInterval = setInterval(() => {
    timerEl.textContent = time;
    timerEl.classList.remove('warning', 'critical');
    
    if (time <= 5) timerEl.classList.add('critical');
    else if (time <= 15) timerEl.classList.add('warning');
    
    time--;
    if (time < 0) {
      clearInterval(timerInterval);
      if (!gameState.answered) nextQuestion();
    }
  }, 1000);
}

function answerQuestion(selected, correct) {
  if (gameState.answered) return;
  gameState.answered = true;
  clearInterval(timerInterval);
  
  if (selected === correct) {
    gameState.p1.score++;
  }
  
  if (Math.random() > 0.4) {
    gameState.p2.score++;
  }
  
  document.getElementById('p1Score').textContent = gameState.p1.score;
  document.getElementById('p2Score').textContent = gameState.p2.score;
  
  setTimeout(nextQuestion, 1500);
}

function nextQuestion() {
  gameState.currentQ++;
  if (gameState.currentQ >= 20) {
    endGame();
  } else {
    loadQuestion();
  }
}

function endGame() {
  clearInterval(timerInterval);
  const p1Wins = gameState.p1.score > gameState.p2.score;
  document.getElementById('winnerName').textContent = p1Wins ? gameState.p1.name : gameState.p2.name;
  document.getElementById('winnerScore').textContent = Math.max(gameState.p1.score, gameState.p2.score);
  document.getElementById('loserName').textContent = p1Wins ? gameState.p2.name : gameState.p1.name;
  document.getElementById('loserScore').textContent = Math.min(gameState.p1.score, gameState.p2.score);
  switchScreen('results');
}

function rematchSamePlayer() {
  gameState.currentQ = 0;
  gameState.p1.score = 0;
  gameState.p2.score = 0;
  switchScreen('gameScreen');
  loadQuestion();
}

// ============= LEADERBOARD FUNCTIONS =============
function switchToLeaderboard() {
  updateLeaderboard();
  switchScreen('leaderboardScreen');
}

function switchLeaderboardTab(e, tab) {
  gameState.currentLeaderboard = tab;
  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
  e.target.classList.add('active');
  updateLeaderboard();
}

function switchTimeframe(e, timeframe) {
  gameState.currentTimeframe = timeframe;
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  e.target.classList.add('active');
  updateLeaderboard();
}

function updateLeaderboard() {
  const data = leaderboardData[gameState.currentLeaderboard] || leaderboardData.overall;
  const tbody = document.getElementById('leaderboardBody');
  tbody.innerHTML = '';
  
  data.forEach((player, idx) => {
    const winRate = Math.round((player.wins / player.games) * 100);
    const row = document.createElement('tr');
    
    let rankClass = '';
    let medal = '';
    if (idx === 0) {
      rankClass = 'gold';
      medal = '🥇';
    } else if (idx === 1) {
      rankClass = 'silver';
      medal = '🥈';
    } else if (idx === 2) {
      rankClass = 'bronze';
      medal = '🥉';
    }
    
    const initials = player.name.split(' ').map(n => n[0]).join('');
    
    row.innerHTML = `
      <td><div class="rank ${rankClass}">${medal || (idx + 1)}</div></td>
      <td>
        <div class="player-cell">
          <div class="avatar">${initials}</div>
          <div class="player-info">
            <div class="player-name">${player.name}</div>
            <div class="player-meta">${player.games} games played</div>
          </div>
        </div>
      </td>
      <td class="stat-cell">${player.points} <span class="stat-small">pts</span></td>
      <td class="stat-cell">${player.wins} <span class="stat-small">W</span></td>
      <td class="stat-cell">${winRate}% <span class="stat-small">ratio</span></td>
    `;
    tbody.appendChild(row);
  });
}

function switchScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}
